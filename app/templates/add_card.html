{% extends "base.html" %}
{% block content %}

<style>
/* ── Queue sidebar ──────────────────────────────────────── */
.queue-section {
  width: 300px;
  flex-shrink: 0;
  position: sticky;
  top: calc(var(--nav-h) + 1rem);
  max-height: calc(100vh - var(--nav-h) - 2rem);
  overflow-y: auto;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
}
.queue-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03);
}
.queue-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 1.05rem;
  font-weight: 700;
}
.queue-title .badge {
  background: #3b82f6;
  color: #fff;
  border-radius: 999px;
  padding: 1px 9px;
  font-size: 0.75rem;
  font-weight: 700;
}
.queue-header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
.q-summary {
  font-size: 0.82rem;
  opacity: 0.5;
}

/* rows */
.q-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.q-row:last-child { border-bottom: none; }
.q-row-top {
  display: flex;
  align-items: center;
  gap: 10px;
}
.q-thumb {
  width: 36px;
  height: 50px;
  object-fit: contain;
  border-radius: 4px;
  flex-shrink: 0;
  background: rgba(255,255,255,0.04);
}
.q-info { flex: 1; min-width: 0; }
.q-name {
  font-weight: 600;
  font-size: 0.85rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.q-meta {
  font-size: 0.72rem;
  opacity: 0.5;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.q-controls {
  display: flex;
  align-items: flex-end;
  gap: 6px;
}
.q-ctrl {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: 1;
  min-width: 0;
}
.q-ctrl label {
  font-size: 0.68rem;
  opacity: 0.5;
  margin: 0;
  white-space: nowrap;
}
.q-ctrl input,
.q-ctrl select {
  width: 100%;
  padding: 4px 6px;
  font-size: 0.8rem;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.07);
  color: inherit;
}
.q-ctrl-qty   { flex: 0 0 54px; }
.q-ctrl-comp  { flex: 1; }
.q-ctrl-grade { flex: 0 0 54px; }
.q-xl-toggle {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  font-size: 0.72rem;
  font-weight: 700;
  border-radius: 20px;
  border: 1.5px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05);
  color: var(--muted);
  cursor: pointer;
  letter-spacing: .04em;
  transition: background .15s, border-color .15s, color .15s;
  align-self: flex-end;
  margin-bottom: 1px;
}
.q-xl-toggle.on {
  background: rgba(251,146,60,.18);
  border-color: #fb923c;
  color: #fb923c;
}
.q-variant-fixed {
  display: inline-block;
  padding: 4px 6px;
  font-size: 0.8rem;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.04);
  color: var(--muted);
}

.q-empty-state {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
  text-align: center;
  font-size: 0.82rem;
  opacity: 0.4;
}
.q-footer {
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  border-top: 1px solid rgba(255,255,255,0.08);
}
.q-footer .q-summary {
  text-align: center;
}

.q-remove {
  background: none;
  border: none;
  cursor: pointer;
  color: inherit;
  opacity: 0.3;
  font-size: 1.25rem;
  padding: 0 4px;
  line-height: 1;
  flex-shrink: 0;
  align-self: center;
}
.q-remove:hover { opacity: 1; color: #f87171; }

/* ── Picker cards: image only, hover to reveal info ─────── */
.picker-card {
  position: relative;
  padding: 0;
  overflow: hidden;
  border-radius: 8px;
  aspect-ratio: 2 / 3;
  background: #0d1117;
}
.picker-card-img {
  width: 100%;
  height: 100%;
}
.picker-card-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.25s ease;
}
.picker-card:hover .picker-card-img img,
.picker-card:focus  .picker-card-img img {
  transform: scale(1.05);
}
.picker-card-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 10px 9px 9px;
  background: linear-gradient(
    to top,
    rgba(0,0,0,0.92) 0%,
    rgba(0,0,0,0.55) 45%,
    transparent      100%
  );
  opacity: 0;
  transition: opacity 0.2s ease;
  pointer-events: none;
}
.picker-card:hover .picker-card-overlay,
.picker-card:focus  .picker-card-overlay { opacity: 1; }

.picker-card-name  { font-size: 0.8rem;  font-weight: 700; color: #fff; line-height: 1.25; margin-bottom: 2px; }
.picker-card-meta  { font-size: 0.68rem; color: #fff; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.picker-card-price { font-size: 0.82rem; font-weight: 700; color: #60a5fa; margin-top: 5px; }

/* queued flash — box-shadow so it works with overflow:hidden */
@keyframes q-flash {
  0%,100% { box-shadow: 0 0 0 2px transparent; }
  35%     { box-shadow: 0 0 0 2px #60a5fa, 0 0 14px rgba(96,165,250,.45); }
}
.picker-card.q-flash { animation: q-flash 0.5s ease-out forwards; }

</style>

<div class="picker-page">

<div class="picker-main">

  <!-- ── Search panel ──────────────────────────────────────── -->
  <div class="picker-search-panel">
    <div class="picker-fields">
      <div class="picker-field">
        <label>Pokémon Name</label>
        <input id="f-name" type="text" class="form-control"
               placeholder="e.g. Charizard" autocomplete="off">
      </div>
      <div class="picker-field">
        <label>Era / Series</label>
        <select id="f-era" class="form-control">
          <option value="">All eras</option>
          <option value="xy">XY (2014–2016)</option>
          <option value="sm">Sun &amp; Moon (2017–2019)</option>
          <option value="swsh">Sword &amp; Shield (2020–2023)</option>
          <option value="sv">Scarlet &amp; Violet (2023–2025)</option>
          <option value="me">Mega Evolution (2025–)</option>
          <option value="promo">Promos</option>
        </select>
      </div>
      <div class="picker-field">
        <label>Set</label>
        <select id="f-set" class="form-control">
          <option value="">All sets</option>
          {% for code, label in all_sets %}
          <option value="{{ code }}" data-era="{{ set_eras[code] }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="picker-field picker-field-sm">
        <label>Card Number</label>
        <input id="f-number" type="text" class="form-control" placeholder="e.g. 4">
      </div>
    </div>

    <div class="picker-actions">
      <button id="btn-search" class="btn btn-primary btn-lg">Search Cards</button>
      <button id="btn-clear"  class="btn btn-outline">Clear</button>
      <span id="search-status" class="search-status"></span>
    </div>
  </div>

  <!-- ── Results grid ──────────────────────────────────────── -->
  <div id="results-area" class="picker-results-area">
    <div class="picker-empty" id="results-empty">
      <div class="picker-empty-icon"></div>
      <p>Search for a card above to see results</p>
    </div>
    <div id="results-grid"    class="picker-grid"    style="display:none"></div>
    <div id="results-loading" class="picker-loading" style="display:none">
      <div class="spinner"></div>
      <p>Searching the Pokédex…</p>
    </div>
    <div id="results-error" class="picker-error" style="display:none"></div>
    <div id="results-pagination" class="picker-pagination" style="display:none">
      <button id="btn-prev" class="btn btn-outline btn-sm">← Prev</button>
      <span   id="page-info" class="page-info"></span>
      <button id="btn-next" class="btn btn-outline btn-sm">Next →</button>
    </div>
  </div><!-- /results-area -->

</div><!-- /picker-main -->

  <!-- ── Queue sidebar ─────────────────────────────────────── -->
  <aside class="queue-section">
    <div class="queue-header">
      <div class="queue-title">
        Queue
        <span id="q-badge" class="badge">0</span>
      </div>
    </div>
    <div id="q-empty-state" class="q-empty-state">
      <p>Click a card to add it to your queue</p>
    </div>
    <div id="q-list"></div>
    <div id="q-footer" class="q-footer" style="display:none">
      <span id="q-summary" class="q-summary"></span>
      <button id="q-clear-btn" class="btn btn-outline btn-sm">Clear All</button>
      <button id="q-save-btn"  class="btn btn-primary" style="width:100%">Save to Collection</button>
    </div>
  </aside>

</div><!-- /picker-page -->

<script>
let currentPage   = 1;
let totalPages    = 1;
let queueItems    = [];   // { uid, card, qty, gradeCompany, grade, variant, isXl }
let nextUid       = 0;

const el = id => document.getElementById(id);

// ── Era → filter set dropdown ─────────────────────────────
el('f-era').addEventListener('change', () => {
  const era = el('f-era').value;
  el('f-set').querySelectorAll('option').forEach(opt => {
    if (!opt.value) { opt.style.display = ''; return; }
    opt.style.display = (!era || opt.dataset.era === era) ? '' : 'none';
  });
  el('f-set').value = '';
});

['f-name','f-number'].forEach(id => {
  el(id).addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(1); });
});

el('btn-search').addEventListener('click', () => doSearch(1));
el('btn-clear').addEventListener('click', () => {
  ['f-name','f-number'].forEach(id => el(id).value = '');
  el('f-era').value = '';
  el('f-set').value = '';
  el('results-grid').style.display     = 'none';
  el('results-empty').style.display    = 'flex';
  el('results-empty').querySelector('p').textContent = 'Search for a card above to see results';
  el('results-pagination').style.display = 'none';
  el('search-status').textContent      = '';
});

el('btn-prev').addEventListener('click', () => { if (currentPage > 1) doSearch(currentPage - 1); });
el('btn-next').addEventListener('click', () => { if (currentPage < totalPages) doSearch(currentPage + 1); });

// ── Search ────────────────────────────────────────────────
function buildParams(page) {
  const p = { page, pageSize: 20 };
  const name    = el('f-name').value.trim();
  const setCode = el('f-set').value.trim();
  const number  = el('f-number').value.trim();
  const era     = el('f-era').value;
  if (name)            p.name     = name;
  if (setCode)         p.set_code = setCode;
  if (number)          p.number   = number;
  if (!setCode && era) p.era      = era;
  return p;
}

async function doSearch(page) {
  currentPage = page;
  const params = buildParams(page);
  if (!params.name && !params.set_code && !params.number && !params.era) {
    el('results-empty').style.display = 'flex';
    el('results-empty').querySelector('p').textContent =
      'Enter a name, pick a set, or choose an era to search.';
    el('search-status').textContent = '';
    return;
  }

  el('results-empty').style.display      = 'none';
  el('results-error').style.display      = 'none';
  el('results-grid').style.display       = 'none';
  el('results-pagination').style.display = 'none';
  el('results-loading').style.display    = 'flex';
  el('search-status').textContent        = 'Searching…';

  try {
    const res  = await fetch(`/api/local-search?${new URLSearchParams(params)}`);
    const data = await res.json();
    el('results-loading').style.display = 'none';
    if (data.error) throw new Error(data.error);

    if (data.catalogEmpty) {
      el('results-empty').style.display = 'flex';
      el('results-empty').querySelector('p').textContent =
        'Card catalog not indexed. Run: python3 index_cards.py';
      el('search-status').textContent = '';
      return;
    }

    const cards = data.data || [];
    totalPages  = Math.ceil((data.totalCount || 0) / 20) || 1;
    el('search-status').textContent =
      `${data.totalCount || 0} result${data.totalCount !== 1 ? 's' : ''}`;

    if (!cards.length) {
      el('results-empty').style.display = 'flex';
      el('results-empty').querySelector('p').textContent =
        'No cards found — try different search terms.';
      return;
    }

    renderGrid(cards);
    if (data.totalCount > 20) {
      el('page-info').textContent         = `Page ${currentPage} of ${totalPages}`;
      el('btn-prev').disabled             = currentPage <= 1;
      el('btn-next').disabled             = currentPage >= totalPages;
      el('results-pagination').style.display = 'flex';
    }
  } catch (err) {
    el('results-loading').style.display = 'none';
    el('results-error').style.display   = 'flex';
    el('results-error').textContent     = err.message || 'Search failed';
    el('search-status').textContent     = '';
  }
}

function getBestPrice(card) {
  const prices = card.tcgplayer?.prices || {};
  const order  = ['holofoil','reverseHolofoil','normal','1stEditionHolofoil','unlimitedHolofoil'];
  for (const key of order) {
    if (prices[key]?.market) return prices[key].market.toFixed(2);
  }
  const first = Object.values(prices)[0];
  return first?.market ? first.market.toFixed(2) : null;
}

function renderGrid(cards) {
  const grid = el('results-grid');
  grid.innerHTML = '';
  cards.forEach(card => {
    const price = getBestPrice(card);
    const btn   = document.createElement('button');
    btn.className = 'picker-card';
    const meta = [card.set?.name, card.number ? '#' + card.number : '', card.rarity]
                   .filter(Boolean).join(' · ');
    btn.innerHTML = `
      <div class="picker-card-img">
        <img src="${card.images?.small || '/static/placeholder.png'}"
             alt="${card.name}" onerror="this.src='/static/placeholder.png'">
      </div>
      <div class="picker-card-overlay">
        <div class="picker-card-name">${card.name}</div>
        <div class="picker-card-meta">${meta}</div>
        ${price ? `<div class="picker-card-price">$${price}</div>` : ''}
      </div>`;

    btn.addEventListener('click', () => {
      addToQueue(card, false);
      btn.classList.add('q-flash');
      setTimeout(() => btn.classList.remove('q-flash'), 550);
    });

    grid.appendChild(btn);
  });
  grid.style.display = 'grid';
}

// ── Variant detection (mirrors server-side logic) ─────────

const VARIANTS = [
  'Standard','Holo','Reverse Holo','Full Art','EX','GX','V','VStar','VMax',
  'BREAK','Prism Star','Amazing Rare','Illustration Rare',
  'Special Illustration Rare','Rainbow Rare','Gold','Secret Rare','Special'
];

function detectVariant(name, rarity, isFoil) {
  const r = (rarity || '').toLowerCase();
  const n = (name   || '').toLowerCase();
  if (r.includes('special illustration rare')) return 'Special Illustration Rare';
  if (r.includes('illustration rare'))         return 'Illustration Rare';
  if (r.includes('hyper rare'))                return 'Gold';
  if (r.includes('rare rainbow') || r.includes('rainbow rare')) return 'Rainbow Rare';
  if (r.includes('rare secret')  || r.includes('secret rare'))  return 'Secret Rare';
  if (r.includes('rare ultra'))                return 'Full Art';
  if (r.includes('amazing rare'))              return 'Amazing Rare';
  if (r.includes('prism star'))                return 'Prism Star';
  if (r.includes('rare break') || n.endsWith(' break')) return 'BREAK';
  if (n.includes('vmax'))  return 'VMax';
  if (n.includes('vstar')) return 'VStar';
  if (n.endsWith('-gx') || n.endsWith(' gx') || r.includes('rare holo gx') || r.includes('shiny gx')) return 'GX';
  if (n.endsWith('-ex') || n.endsWith(' ex') || r.includes('holo ex')) return 'EX';
  if ((r.includes('rare holo v') && !r.includes('vmax') && !r.includes('vstar')) ||
      (n.endsWith(' v') && !n.includes('vmax') && !n.includes('vstar'))) return 'V';
  if (r.includes('reverse holo'))       return 'Reverse Holo';
  if (r.includes('holo') || isFoil)    return 'Holo';
  return 'Standard';
}

/**
 * Returns the list of versions this card physically exists in.
 * Common / Uncommon / plain Rare (non-holo) cards come in Standard
 * and Reverse Holo. Everything else is a single fixed variant.
 */
function getAvailableVariants(name, rarity) {
  const r = (rarity || '').toLowerCase().trim();
  if (r === 'common' || r === 'uncommon' || r === 'rare') {
    return ['Standard', 'Reverse Holo'];
  }
  return [detectVariant(name, rarity, false)];
}

// ── Queue ─────────────────────────────────────────────────

function addToQueue(card, isXl = false) {
  const available   = getAvailableVariants(card.name, card.rarity);
  const autoVariant = available[0];
  queueItems.push({
    uid: nextUid++, card, qty: 1,
    gradeCompany: '', grade: '',
    variant: autoVariant, availableVariants: available,
    isXl: !!isXl,
  });
  syncQueue();
}

function removeFromQueue(uid) {
  queueItems = queueItems.filter(i => i.uid !== uid);
  syncQueue();
}

function syncQueue() {
  const list    = el('q-list');
  const badge   = el('q-badge');
  const summary = el('q-summary');

  badge.textContent = queueItems.length;
  el('q-empty-state').style.display = queueItems.length ? 'none' : '';
  el('q-footer').style.display      = queueItems.length ? ''     : 'none';

  if (!queueItems.length) {
    list.innerHTML = '';
    return;
  }

  list.innerHTML = '';
  queueItems.forEach(item => {
    const row = document.createElement('div');
    row.className = 'q-row';
    row.innerHTML = `
      <div class="q-row-top">
        <img class="q-thumb"
             src="${item.card.images?.small || '/static/placeholder.png'}"
             alt="${item.card.name}" onerror="this.src='/static/placeholder.png'">
        <div class="q-info">
          <div class="q-name">${item.card.name}</div>
          <div class="q-meta">
            ${item.card.set?.name || ''}${item.card.number ? ' · #' + item.card.number : ''}
          </div>
        </div>
        <button class="q-remove" data-uid="${item.uid}" title="Remove">×</button>
      </div>
      <div class="q-controls">
        <div class="q-ctrl q-ctrl-qty">
          <label>Qty</label>
          <input type="number" min="1" value="${item.qty}"
                 data-uid="${item.uid}" data-field="qty">
        </div>
        <div class="q-ctrl q-ctrl-comp">
          <label>Grading co.</label>
          <select data-uid="${item.uid}" data-field="gradeCompany">
            <option value="">None</option>
            <option value="PSA" ${item.gradeCompany==='PSA'?'selected':''}>PSA</option>
            <option value="BGS" ${item.gradeCompany==='BGS'?'selected':''}>BGS</option>
            <option value="CGC" ${item.gradeCompany==='CGC'?'selected':''}>CGC</option>
            <option value="SGC" ${item.gradeCompany==='SGC'?'selected':''}>SGC</option>
          </select>
        </div>
        <div class="q-ctrl q-ctrl-grade" style="${item.gradeCompany?'':'visibility:hidden'}">
          <label>Grade</label>
          <input type="number" min="1" max="10" step="0.5"
                 value="${item.grade}" placeholder="9.5"
                 data-uid="${item.uid}" data-field="grade">
        </div>
      </div>
      <div class="q-controls">
        <div class="q-ctrl" style="flex:1">
          <label>Version</label>
          ${item.availableVariants.length > 1
            ? `<select data-uid="${item.uid}" data-field="variant">
                ${item.availableVariants.map(v => `<option value="${v}" ${item.variant===v?'selected':''}>${v}</option>`).join('')}
               </select>`
            : `<span class="q-variant-fixed">${item.variant}</span>`
          }
        </div>
        <button class="q-xl-toggle ${item.isXl ? 'on' : ''}"
                data-uid="${item.uid}" title="Mark as XL / oversized card">
          XL
        </button>
      </div>`;
    list.appendChild(row);
  });

  // Wire controls
  list.querySelectorAll('[data-uid]').forEach(node => {
    const uid   = parseInt(node.dataset.uid);
    const field = node.dataset.field;
    if (!field) return;
    const update = () => {
      const item = queueItems.find(i => i.uid === uid);
      if (!item) return;
      if (field === 'qty') {
        item.qty = Math.max(1, parseInt(node.value) || 1);
      } else if (field === 'gradeCompany') {
        item.gradeCompany = node.value;
        const gradeCtrl = node.closest('.q-controls')
                              .querySelector('[data-field="grade"]')
                              ?.closest('.q-ctrl');
        if (gradeCtrl) gradeCtrl.style.visibility = node.value ? '' : 'hidden';
      } else if (field === 'grade') {
        item.grade = node.value;
      } else if (field === 'variant') {
        item.variant = node.value;
      }
    };
    node.addEventListener('change', update);
    node.addEventListener('input',  update);
  });

  list.querySelectorAll('.q-xl-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const uid  = parseInt(btn.dataset.uid);
      const item = queueItems.find(i => i.uid === uid);
      if (!item) return;
      item.isXl = !item.isXl;
      btn.classList.toggle('on', item.isXl);
    });
  });

  list.querySelectorAll('.q-remove').forEach(btn => {
    btn.addEventListener('click', () => removeFromQueue(parseInt(btn.dataset.uid)));
  });

  // Summary
  const est = queueItems.reduce(
    (s, i) => s + (parseFloat(getBestPrice(i.card)) || 0) * i.qty, 0
  );
  const n = queueItems.length;
  summary.textContent = est > 0
    ? `${n} card${n !== 1 ? 's' : ''} · est. $${est.toFixed(2)}`
    : `${n} card${n !== 1 ? 's' : ''}`;
}

el('q-clear-btn').addEventListener('click', () => {
  queueItems = [];
  syncQueue();
});

el('q-save-btn').addEventListener('click', saveAll);

async function saveAll() {
  if (!queueItems.length) return;
  const btn   = el('q-save-btn');
  const total = queueItems.length;
  btn.disabled = true;

  const failed = [];
  let saved = 0;

  for (const item of queueItems) {
    btn.textContent = `Saving ${saved + failed.length + 1} / ${total}…`;
    const { card, qty, gradeCompany, grade, variant, isXl, isFoil } = item;
    const gradeStr = gradeCompany && grade ? `${gradeCompany} ${grade}` : (gradeCompany || null);
    const autoFoil = (card.rarity || '').toLowerCase().includes('holo');
    const payload  = {
      name:         card.name,
      card_number:  card.number,
      set_name:     card.set?.name,
      set_code:     card.set?.id,
      rarity:       card.rarity,
      card_type:    card.supertype,
      pokemon_type: (card.types || [])[0] || '',
      hp:           card.hp ? parseInt(card.hp) : null,
      image_url:    card.images?.large || card.images?.small || '',
      quantity:     qty,
      market_price: parseFloat(getBestPrice(card)) || null,
      is_graded:    !!gradeCompany,
      grade:        gradeStr,
      is_foil:      isFoil !== undefined ? !!isFoil : autoFoil,
      variant:      variant || null,
      is_xl:        !!isXl,
    };
    try {
      const res  = await fetch('/api/cards/quick-add', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload),
      });
      const data = await res.json();
      if (data.ok) saved++;
      else failed.push(item);
    } catch { failed.push(item); }
  }

  if (!failed.length) {
    window.location.href = '/collection';
    return;
  }

  btn.disabled    = false;
  btn.textContent = 'Save to Collection';
  queueItems      = failed;
  syncQueue();
  alert(`${saved} saved. ${failed.length} failed — they remain in your queue.`);
}
</script>
{% endblock %}
