{% extends "base.html" %}
{% block content %}

<div class="picker-page">

  <!-- ── Top: Search parameters ──────────────────────────── -->
  <div class="picker-search-panel">
    <h1 class="picker-title">Add a Card</h1>
    <p class="picker-subtitle">Fill in any fields and hit Search — then click a card to save it.</p>

    <div class="picker-fields">
      <div class="picker-field">
        <label>Pokémon Name</label>
        <input id="f-name" type="text" class="form-control" placeholder="e.g. Charizard" autocomplete="off">
      </div>
      <div class="picker-field">
        <label>Era / Series</label>
        <select id="f-era" class="form-control">
          <option value="">All eras</option>
          <option value="xy">XY (2014–2016)</option>
          <option value="sm">Sun &amp; Moon (2017–2019)</option>
          <option value="swsh">Sword &amp; Shield (2020–2023)</option>
          <option value="sv">Scarlet &amp; Violet (2023–2026)</option>
        </select>
      </div>
      <div class="picker-field">
        <label>Set</label>
        <select id="f-set" class="form-control">
          <option value="">All sets</option>
          {% for code, label in all_sets %}
          <option value="{{ code }}" data-era="{{ code[:2] if not code.startswith('swsh') and not code.startswith('cel') and not code.startswith('pgo') else ('swsh' if code.startswith('swsh') or code in ['cel25','pgo'] else code[:2]) }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="picker-field picker-field-sm">
        <label>Card Number</label>
        <input id="f-number" type="text" class="form-control" placeholder="e.g. 4">
      </div>
      <div class="picker-field">
        <label>Condition</label>
        <select id="f-condition" class="form-control">
          <option value="NM">Near Mint (NM)</option>
          <option value="M">Mint (M)</option>
          <option value="LP">Lightly Played (LP)</option>
          <option value="MP">Moderately Played (MP)</option>
          <option value="HP">Heavily Played (HP)</option>
          <option value="DMG">Damaged (DMG)</option>
        </select>
      </div>
    </div>

    <div class="picker-actions">
      <button id="btn-search" class="btn btn-primary btn-lg">🔍 Search Cards</button>
      <button id="btn-clear" class="btn btn-outline">Clear</button>
      <span id="search-status" class="search-status"></span>
    </div>
  </div>

  <!-- ── Bottom: Results grid ────────────────────────────── -->
  <div id="results-area" class="picker-results-area">
    <div class="picker-empty" id="results-empty">
      <div class="picker-empty-icon">🃏</div>
      <p>Search for a card above to see results</p>
    </div>
    <div id="results-grid" class="picker-grid" style="display:none"></div>
    <div id="results-loading" class="picker-loading" style="display:none">
      <div class="spinner"></div>
      <p>Searching the Pokédex…</p>
    </div>
    <div id="results-error" class="picker-error" style="display:none"></div>
    <div id="results-pagination" class="picker-pagination" style="display:none">
      <button id="btn-prev" class="btn btn-outline btn-sm">← Prev</button>
      <span id="page-info" class="page-info"></span>
      <button id="btn-next" class="btn btn-outline btn-sm">Next →</button>
    </div>
  </div>

</div>

<!-- ── Confirm modal ──────────────────────────────────────── -->
<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div class="modal-card">
    <button class="modal-close" id="modal-close">×</button>
    <div class="modal-inner">
      <div class="modal-img-col">
        <img id="modal-img" src="" alt="">
      </div>
      <div class="modal-info-col">
        <h2 id="modal-name"></h2>
        <div id="modal-meta" class="modal-meta"></div>
        <div id="modal-price" class="modal-price-block"></div>

        <div class="modal-form">
          <div class="form-row-2">
            <div class="form-group">
              <label>Condition</label>
              <select id="modal-condition" class="form-control">
                <option value="NM">Near Mint (NM)</option>
                <option value="M">Mint (M)</option>
                <option value="LP">Lightly Played (LP)</option>
                <option value="MP">Moderately Played (MP)</option>
                <option value="HP">Heavily Played (HP)</option>
                <option value="DMG">Damaged (DMG)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Quantity</label>
              <input id="modal-qty" type="number" class="form-control" value="1" min="1">
            </div>
          </div>
          <div class="form-row-2">
            <div class="form-group">
              <label>Purchase Price ($)</label>
              <input id="modal-purchase" type="number" class="form-control" placeholder="0.00" step="0.01" min="0">
            </div>
            <div class="form-group">
              <label>Graded?</label>
              <select id="modal-graded" class="form-control">
                <option value="">Not graded</option>
                <option value="PSA 10">PSA 10</option>
                <option value="PSA 9">PSA 9</option>
                <option value="PSA 8">PSA 8</option>
                <option value="BGS 10">BGS 10</option>
                <option value="BGS 9.5">BGS 9.5</option>
                <option value="CGC 10">CGC 10</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Notes</label>
            <textarea id="modal-notes" class="form-control" rows="2" placeholder="Optional notes…"></textarea>
          </div>
        </div>

        <button id="modal-save" class="btn btn-primary btn-lg btn-full">
          ✅ Add to Collection
        </button>
      </div>
    </div>
  </div>
</div>

<script>
const ERA_PREFIXES = {
  xy: ['xy'],
  sm: ['sm'],
  swsh: ['swsh', 'cel', 'pgo'],
  sv: ['sv']
};

let currentPage = 1;
let totalPages  = 1;
let lastQuery   = {};
let selectedCard = null;

const $ = id => document.getElementById(id);

// ── Era → filter set dropdown ──────────────────────────────
$('f-era').addEventListener('change', () => {
  const era = $('f-era').value;
  $('f-set').querySelectorAll('option').forEach(opt => {
    if (!opt.value) { opt.style.display = ''; return; }
    opt.style.display = (!era || opt.dataset.era === era) ? '' : 'none';
  });
  $('f-set').value = '';
});

// ── Enter key triggers search ──────────────────────────────
['f-name','f-number'].forEach(id => {
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(1); });
});

$('btn-search').addEventListener('click', () => doSearch(1));
$('btn-clear').addEventListener('click', () => {
  ['f-name','f-number'].forEach(id => $(id).value = '');
  $('f-era').value = ''; $('f-set').value = '';
  $('results-grid').style.display = 'none';
  $('results-empty').style.display = 'flex';
  $('results-pagination').style.display = 'none';
  $('search-status').textContent = '';
});

$('btn-prev').addEventListener('click', () => { if (currentPage > 1) doSearch(currentPage - 1); });
$('btn-next').addEventListener('click', () => { if (currentPage < totalPages) doSearch(currentPage + 1); });

function buildQuery(page) {
  const parts = [];
  const name   = $('f-name').value.trim();
  const setId  = $('f-set').value.trim();
  const number = $('f-number').value.trim();

  if (name)   parts.push(`name:"${name}*"`);
  if (setId)  parts.push(`set.id:${setId}`);
  if (number) parts.push(`number:${number}`);

  // If only era selected (no set), filter by prefix
  if (!setId && $('f-era').value) {
    const prefixes = ERA_PREFIXES[$('f-era').value] || [];
    if (prefixes.length) {
      const setQ = prefixes.map(p => `set.id:${p}*`).join(' OR ');
      parts.push(`(${setQ})`);
    }
  }

  const q = parts.length ? parts.join(' ') : 'name:*';
  return { q, page, pageSize: 20 };
}

async function doSearch(page) {
  currentPage = page;
  lastQuery = buildQuery(page);

  $('results-empty').style.display = 'none';
  $('results-error').style.display = 'none';
  $('results-grid').style.display  = 'none';
  $('results-pagination').style.display = 'none';
  $('results-loading').style.display = 'flex';
  $('search-status').textContent = 'Searching…';

  const params = new URLSearchParams(lastQuery);
  try {
    const res  = await fetch(`/api/tcg-search?${params}`);
    const data = await res.json();
    $('results-loading').style.display = 'none';

    if (data.error) throw new Error(data.error);

    const cards = data.data || [];
    totalPages  = Math.ceil((data.totalCount || 0) / 20) || 1;
    $('search-status').textContent = `${data.totalCount || 0} result${data.totalCount !== 1 ? 's' : ''}`;

    if (!cards.length) {
      $('results-empty').style.display = 'flex';
      $('results-empty').querySelector('p').textContent = 'No cards found — try different search terms.';
      return;
    }

    renderGrid(cards);
    if (data.totalCount > 20) {
      $('page-info').textContent = `Page ${currentPage} of ${totalPages}`;
      $('btn-prev').disabled = currentPage <= 1;
      $('btn-next').disabled = currentPage >= totalPages;
      $('results-pagination').style.display = 'flex';
    }
  } catch (err) {
    $('results-loading').style.display = 'none';
    $('results-error').style.display = 'flex';
    $('results-error').textContent = '⚠ ' + (err.message || 'Search failed');
    $('search-status').textContent = '';
  }
}

function renderGrid(cards) {
  const grid = $('results-grid');
  grid.innerHTML = '';
  cards.forEach(card => {
    const price = getBestPrice(card);
    const el = document.createElement('button');
    el.className = 'picker-card';
    el.innerHTML = `
      <div class="picker-card-img">
        <img src="${card.images?.small || '/static/placeholder.png'}"
             alt="${card.name}"
             onerror="this.src='/static/placeholder.png'">
      </div>
      <div class="picker-card-body">
        <div class="picker-card-name">${card.name}</div>
        <div class="picker-card-set">${card.set?.name || ''}</div>
        <div class="picker-card-num">#${card.number || '—'} · ${card.rarity || ''}</div>
        ${price ? `<div class="picker-card-price">$${price}</div>` : ''}
      </div>
    `;
    el.addEventListener('click', () => openModal(card));
    grid.appendChild(el);
  });
  grid.style.display = 'grid';
}

function getBestPrice(card) {
  const prices = card.tcgplayer?.prices || {};
  const order  = ['holofoil','reverseHolofoil','normal','1stEditionHolofoil','unlimitedHolofoil'];
  for (const key of order) {
    if (prices[key]?.market) return prices[key].market.toFixed(2);
  }
  const first = Object.values(prices)[0];
  if (first?.market) return first.market.toFixed(2);
  return null;
}

function openModal(card) {
  selectedCard = card;
  $('modal-img').src = card.images?.large || card.images?.small || '/static/placeholder.png';
  $('modal-name').textContent = card.name;

  const price = getBestPrice(card);
  $('modal-price').innerHTML = price
    ? `<div class="modal-price-label">Market Price</div><div class="modal-price-value">$${price}</div>`
    : `<div class="modal-price-label" style="color:var(--muted)">No price data</div>`;

  $('modal-meta').innerHTML = `
    <div class="detail-row"><span class="detail-label">Set</span><span>${card.set?.name || '—'}</span></div>
    <div class="detail-row"><span class="detail-label">Number</span><span>${card.number || '—'}</span></div>
    <div class="detail-row"><span class="detail-label">Rarity</span><span>${card.rarity || '—'}</span></div>
    <div class="detail-row"><span class="detail-label">Type</span><span>${(card.types||[]).join(', ') || '—'}</span></div>
    <div class="detail-row"><span class="detail-label">HP</span><span>${card.hp || '—'}</span></div>
  `;

  // Pre-fill condition from search bar
  $('modal-condition').value = $('f-condition').value;
  $('modal-qty').value = 1;
  $('modal-purchase').value = price || '';
  $('modal-graded').value = '';
  $('modal-notes').value = '';

  $('modal-overlay').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  $('modal-overlay').style.display = 'none';
  document.body.style.overflow = '';
}
$('modal-close').addEventListener('click', closeModal);
$('modal-overlay').addEventListener('click', e => { if (e.target === $('modal-overlay')) closeModal(); });

$('modal-save').addEventListener('click', async () => {
  if (!selectedCard) return;
  const btn = $('modal-save');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  const grade = $('modal-graded').value;
  const payload = {
    name:           selectedCard.name,
    card_number:    selectedCard.number,
    set_name:       selectedCard.set?.name,
    set_code:       selectedCard.set?.id,
    rarity:         selectedCard.rarity,
    card_type:      selectedCard.supertype,
    pokemon_type:   (selectedCard.types || [])[0] || '',
    hp:             selectedCard.hp ? parseInt(selectedCard.hp) : null,
    image_url:      selectedCard.images?.large || selectedCard.images?.small || '',
    condition:      $('modal-condition').value,
    quantity:       parseInt($('modal-qty').value) || 1,
    purchase_price: parseFloat($('modal-purchase').value) || null,
    market_price:   parseFloat(getBestPrice(selectedCard)) || null,
    is_graded:      !!grade,
    grade:          grade || null,
    notes:          $('modal-notes').value,
    is_foil:        (selectedCard.rarity || '').toLowerCase().includes('holo'),
  };

  try {
    const res = await fetch('/api/cards/quick-add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.ok) {
      window.location.href = data.redirect || '/collection';
    } else {
      throw new Error(data.error || 'Save failed');
    }
  } catch (err) {
    btn.disabled = false;
    btn.textContent = '✅ Add to Collection';
    alert('Error: ' + err.message);
  }
});
</script>
{% endblock %}
