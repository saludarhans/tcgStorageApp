{% extends "base.html" %}
{% block content %}

<style>
/* ── Queue section ──────────────────────────────────────── */
.queue-section {
  margin-top: 40px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  overflow: hidden;
}
.queue-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03);
}
.queue-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 1.05rem;
  font-weight: 700;
}
.queue-title .badge {
  background: #3b82f6;
  color: #fff;
  border-radius: 999px;
  padding: 1px 9px;
  font-size: 0.75rem;
  font-weight: 700;
}
.queue-header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
.q-summary {
  font-size: 0.82rem;
  opacity: 0.5;
}

/* rows */
.q-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.q-row:last-child { border-bottom: none; }
.q-thumb {
  width: 44px;
  height: 60px;
  object-fit: contain;
  border-radius: 4px;
  flex-shrink: 0;
  background: rgba(255,255,255,0.04);
}
.q-info { flex: 1; min-width: 0; }
.q-name {
  font-weight: 600;
  font-size: 0.9rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.q-meta {
  font-size: 0.75rem;
  opacity: 0.5;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.q-controls {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  flex-shrink: 0;
}
.q-ctrl {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.q-ctrl label {
  font-size: 0.7rem;
  opacity: 0.5;
  margin: 0;
  white-space: nowrap;
}
.q-ctrl input,
.q-ctrl select {
  padding: 5px 8px;
  font-size: 0.82rem;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.07);
  color: inherit;
}
.q-ctrl-qty   { width: 64px; }
.q-ctrl-comp  { width: 84px; }
.q-ctrl-grade { width: 68px; }

.q-remove {
  background: none;
  border: none;
  cursor: pointer;
  color: inherit;
  opacity: 0.3;
  font-size: 1.25rem;
  padding: 0 4px;
  line-height: 1;
  flex-shrink: 0;
  align-self: center;
}
.q-remove:hover { opacity: 1; color: #f87171; }

/* card queued flash */
@keyframes q-flash {
  0%   { outline: 2px solid transparent; }
  35%  { outline: 2px solid #60a5fa; box-shadow: 0 0 10px rgba(96,165,250,.35); }
  100% { outline: 2px solid transparent; }
}
.picker-card.q-flash { animation: q-flash 0.5s ease-out forwards; }
</style>

<div class="picker-page">

  <!-- ── Search panel ──────────────────────────────────────── -->
  <div class="picker-search-panel">
    <h1 class="picker-title">Add a Card</h1>
    <p class="picker-subtitle">Search below — click any result to queue it, then save all at once.</p>

    <div class="picker-fields">
      <div class="picker-field">
        <label>Pokémon Name</label>
        <input id="f-name" type="text" class="form-control"
               placeholder="e.g. Charizard" autocomplete="off">
      </div>
      <div class="picker-field">
        <label>Era / Series</label>
        <select id="f-era" class="form-control">
          <option value="">All eras</option>
          <option value="xy">XY (2014–2016)</option>
          <option value="sm">Sun &amp; Moon (2017–2019)</option>
          <option value="swsh">Sword &amp; Shield (2020–2023)</option>
          <option value="sv">Scarlet &amp; Violet (2023–2026)</option>
        </select>
      </div>
      <div class="picker-field">
        <label>Set</label>
        <select id="f-set" class="form-control">
          <option value="">All sets</option>
          {% for code, label in all_sets %}
          <option value="{{ code }}"
            data-era="{{ code[:2] if not code.startswith('swsh') and not code.startswith('cel') and not code.startswith('pgo') else ('swsh' if code.startswith('swsh') or code in ['cel25','pgo'] else code[:2]) }}">
            {{ label }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="picker-field picker-field-sm">
        <label>Card Number</label>
        <input id="f-number" type="text" class="form-control" placeholder="e.g. 4">
      </div>
    </div>

    <div class="picker-actions">
      <button id="btn-search" class="btn btn-primary btn-lg">Search Cards</button>
      <button id="btn-clear"  class="btn btn-outline">Clear</button>
      <span id="search-status" class="search-status"></span>
    </div>
  </div>

  <!-- ── Results grid ──────────────────────────────────────── -->
  <div id="results-area" class="picker-results-area">
    <div class="picker-empty" id="results-empty">
      <div class="picker-empty-icon"></div>
      <p>Search for a card above to see results</p>
    </div>
    <div id="results-grid"    class="picker-grid"    style="display:none"></div>
    <div id="results-loading" class="picker-loading" style="display:none">
      <div class="spinner"></div>
      <p>Searching the Pokédex…</p>
    </div>
    <div id="results-error" class="picker-error" style="display:none"></div>
    <div id="results-pagination" class="picker-pagination" style="display:none">
      <button id="btn-prev" class="btn btn-outline btn-sm">← Prev</button>
      <span   id="page-info" class="page-info"></span>
      <button id="btn-next" class="btn btn-outline btn-sm">Next →</button>
    </div>
  </div>

  <!-- ── Queue (inline, below results) ─────────────────────── -->
  <section id="queue-section" class="queue-section" style="display:none">
    <div class="queue-header">
      <div class="queue-title">
        Queue
        <span id="q-badge" class="badge">0</span>
      </div>
      <div class="queue-header-right">
        <span id="q-summary" class="q-summary"></span>
        <button id="q-clear-btn" class="btn btn-outline btn-sm">Clear All</button>
        <button id="q-save-btn"  class="btn btn-primary">Save to Collection</button>
      </div>
    </div>
    <div id="q-list"></div>
  </section>

</div><!-- /picker-page -->

<script>
let currentPage   = 1;
let totalPages    = 1;
let queueItems    = [];   // { uid, card, qty, gradeCompany, grade }
let nextUid       = 0;

const el = id => document.getElementById(id);

// ── Era → filter set dropdown ─────────────────────────────
el('f-era').addEventListener('change', () => {
  const era = el('f-era').value;
  el('f-set').querySelectorAll('option').forEach(opt => {
    if (!opt.value) { opt.style.display = ''; return; }
    opt.style.display = (!era || opt.dataset.era === era) ? '' : 'none';
  });
  el('f-set').value = '';
});

['f-name','f-number'].forEach(id => {
  el(id).addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(1); });
});

el('btn-search').addEventListener('click', () => doSearch(1));
el('btn-clear').addEventListener('click', () => {
  ['f-name','f-number'].forEach(id => el(id).value = '');
  el('f-era').value = '';
  el('f-set').value = '';
  el('results-grid').style.display     = 'none';
  el('results-empty').style.display    = 'flex';
  el('results-empty').querySelector('p').textContent = 'Search for a card above to see results';
  el('results-pagination').style.display = 'none';
  el('search-status').textContent      = '';
});

el('btn-prev').addEventListener('click', () => { if (currentPage > 1) doSearch(currentPage - 1); });
el('btn-next').addEventListener('click', () => { if (currentPage < totalPages) doSearch(currentPage + 1); });

// ── Search ────────────────────────────────────────────────
function buildParams(page) {
  const p = { page, pageSize: 20 };
  const name    = el('f-name').value.trim();
  const setCode = el('f-set').value.trim();
  const number  = el('f-number').value.trim();
  const era     = el('f-era').value;
  if (name)            p.name     = name;
  if (setCode)         p.set_code = setCode;
  if (number)          p.number   = number;
  if (!setCode && era) p.era      = era;
  return p;
}

async function doSearch(page) {
  currentPage = page;
  const params = buildParams(page);
  if (!params.name && !params.set_code && !params.number && !params.era) {
    el('results-empty').style.display = 'flex';
    el('results-empty').querySelector('p').textContent =
      'Enter a name, pick a set, or choose an era to search.';
    el('search-status').textContent = '';
    return;
  }

  el('results-empty').style.display      = 'none';
  el('results-error').style.display      = 'none';
  el('results-grid').style.display       = 'none';
  el('results-pagination').style.display = 'none';
  el('results-loading').style.display    = 'flex';
  el('search-status').textContent        = 'Searching…';

  try {
    const res  = await fetch(`/api/local-search?${new URLSearchParams(params)}`);
    const data = await res.json();
    el('results-loading').style.display = 'none';
    if (data.error) throw new Error(data.error);

    if (data.catalogEmpty) {
      el('results-empty').style.display = 'flex';
      el('results-empty').querySelector('p').textContent =
        'Card catalog not indexed. Run: python3 index_cards.py';
      el('search-status').textContent = '';
      return;
    }

    const cards = data.data || [];
    totalPages  = Math.ceil((data.totalCount || 0) / 20) || 1;
    el('search-status').textContent =
      `${data.totalCount || 0} result${data.totalCount !== 1 ? 's' : ''}`;

    if (!cards.length) {
      el('results-empty').style.display = 'flex';
      el('results-empty').querySelector('p').textContent =
        'No cards found — try different search terms.';
      return;
    }

    renderGrid(cards);
    if (data.totalCount > 20) {
      el('page-info').textContent         = `Page ${currentPage} of ${totalPages}`;
      el('btn-prev').disabled             = currentPage <= 1;
      el('btn-next').disabled             = currentPage >= totalPages;
      el('results-pagination').style.display = 'flex';
    }
  } catch (err) {
    el('results-loading').style.display = 'none';
    el('results-error').style.display   = 'flex';
    el('results-error').textContent     = err.message || 'Search failed';
    el('search-status').textContent     = '';
  }
}

function getBestPrice(card) {
  const prices = card.tcgplayer?.prices || {};
  const order  = ['holofoil','reverseHolofoil','normal','1stEditionHolofoil','unlimitedHolofoil'];
  for (const key of order) {
    if (prices[key]?.market) return prices[key].market.toFixed(2);
  }
  const first = Object.values(prices)[0];
  return first?.market ? first.market.toFixed(2) : null;
}

function renderGrid(cards) {
  const grid = el('results-grid');
  grid.innerHTML = '';
  cards.forEach(card => {
    const price = getBestPrice(card);
    const btn   = document.createElement('button');
    btn.className = 'picker-card';
    btn.innerHTML = `
      <div class="picker-card-img">
        <img src="${card.images?.small || '/static/placeholder.png'}"
             alt="${card.name}" onerror="this.src='/static/placeholder.png'">
      </div>
      <div class="picker-card-body">
        <div class="picker-card-name">${card.name}</div>
        <div class="picker-card-set">${card.set?.name || ''}</div>
        <div class="picker-card-num">#${card.number || '—'} · ${card.rarity || ''}</div>
        ${price ? `<div class="picker-card-price">$${price}</div>` : ''}
      </div>`;
    btn.addEventListener('click', () => {
      addToQueue(card);
      btn.classList.add('q-flash');
      setTimeout(() => btn.classList.remove('q-flash'), 550);
    });
    grid.appendChild(btn);
  });
  grid.style.display = 'grid';
}

// ── Queue ─────────────────────────────────────────────────

function addToQueue(card) {
  queueItems.push({ uid: nextUid++, card, qty: 1, gradeCompany: '', grade: '' });
  syncQueue();
  const section = el('queue-section');
  if (section.style.display === 'none') {
    section.style.display = '';
    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function removeFromQueue(uid) {
  queueItems = queueItems.filter(i => i.uid !== uid);
  syncQueue();
  if (!queueItems.length) el('queue-section').style.display = 'none';
}

function syncQueue() {
  const list    = el('q-list');
  const badge   = el('q-badge');
  const summary = el('q-summary');

  badge.textContent = queueItems.length;

  if (!queueItems.length) {
    list.innerHTML = '';
    summary.textContent = '';
    return;
  }

  list.innerHTML = '';
  queueItems.forEach(item => {
    const row = document.createElement('div');
    row.className = 'q-row';
    row.innerHTML = `
      <img class="q-thumb"
           src="${item.card.images?.small || '/static/placeholder.png'}"
           alt="${item.card.name}" onerror="this.src='/static/placeholder.png'">
      <div class="q-info">
        <div class="q-name">${item.card.name}</div>
        <div class="q-meta">
          ${item.card.set?.name || ''}${item.card.number ? ' · #' + item.card.number : ''}${item.card.rarity ? ' · ' + item.card.rarity : ''}
        </div>
      </div>
      <div class="q-controls">
        <div class="q-ctrl">
          <label>Qty</label>
          <input class="q-ctrl-qty" type="number" min="1" value="${item.qty}"
                 data-uid="${item.uid}" data-field="qty">
        </div>
        <div class="q-ctrl">
          <label>Grading co.</label>
          <select class="q-ctrl-comp" data-uid="${item.uid}" data-field="gradeCompany">
            <option value="">None</option>
            <option value="PSA" ${item.gradeCompany==='PSA'?'selected':''}>PSA</option>
            <option value="BGS" ${item.gradeCompany==='BGS'?'selected':''}>BGS</option>
            <option value="CGC" ${item.gradeCompany==='CGC'?'selected':''}>CGC</option>
            <option value="SGC" ${item.gradeCompany==='SGC'?'selected':''}>SGC</option>
          </select>
        </div>
        <div class="q-ctrl" style="${item.gradeCompany?'':'visibility:hidden'}">
          <label>Grade</label>
          <input class="q-ctrl-grade" type="number" min="1" max="10" step="0.5"
                 value="${item.grade}" placeholder="e.g. 9.5"
                 data-uid="${item.uid}" data-field="grade">
        </div>
      </div>
      <button class="q-remove" data-uid="${item.uid}" title="Remove">×</button>`;
    list.appendChild(row);
  });

  // Wire controls
  list.querySelectorAll('[data-uid]').forEach(node => {
    const uid   = parseInt(node.dataset.uid);
    const field = node.dataset.field;
    if (!field) return;
    const update = () => {
      const item = queueItems.find(i => i.uid === uid);
      if (!item) return;
      if (field === 'qty') {
        item.qty = Math.max(1, parseInt(node.value) || 1);
      } else if (field === 'gradeCompany') {
        item.gradeCompany = node.value;
        const gradeCtrl = node.closest('.q-controls')
                              .querySelector('[data-field="grade"]')
                              ?.closest('.q-ctrl');
        if (gradeCtrl) gradeCtrl.style.visibility = node.value ? '' : 'hidden';
      } else if (field === 'grade') {
        item.grade = node.value;
      }
    };
    node.addEventListener('change', update);
    node.addEventListener('input',  update);
  });

  list.querySelectorAll('.q-remove').forEach(btn => {
    btn.addEventListener('click', () => removeFromQueue(parseInt(btn.dataset.uid)));
  });

  // Summary
  const est = queueItems.reduce(
    (s, i) => s + (parseFloat(getBestPrice(i.card)) || 0) * i.qty, 0
  );
  const n = queueItems.length;
  summary.textContent = est > 0
    ? `${n} card${n !== 1 ? 's' : ''} · est. $${est.toFixed(2)}`
    : `${n} card${n !== 1 ? 's' : ''}`;
}

el('q-clear-btn').addEventListener('click', () => {
  queueItems = [];
  syncQueue();
  el('queue-section').style.display = 'none';
});

el('q-save-btn').addEventListener('click', saveAll);

async function saveAll() {
  if (!queueItems.length) return;
  const btn   = el('q-save-btn');
  const total = queueItems.length;
  btn.disabled = true;

  const failed = [];
  let saved = 0;

  for (const item of queueItems) {
    btn.textContent = `Saving ${saved + failed.length + 1} / ${total}…`;
    const { card, qty, gradeCompany, grade } = item;
    const gradeStr = gradeCompany && grade ? `${gradeCompany} ${grade}` : (gradeCompany || null);
    const payload  = {
      name:         card.name,
      card_number:  card.number,
      set_name:     card.set?.name,
      set_code:     card.set?.id,
      rarity:       card.rarity,
      card_type:    card.supertype,
      pokemon_type: (card.types || [])[0] || '',
      hp:           card.hp ? parseInt(card.hp) : null,
      image_url:    card.images?.large || card.images?.small || '',
      condition:    'NM',
      quantity:     qty,
      market_price: parseFloat(getBestPrice(card)) || null,
      is_graded:    !!gradeCompany,
      grade:        gradeStr,
      is_foil:      (card.rarity || '').toLowerCase().includes('holo'),
    };
    try {
      const res  = await fetch('/api/cards/quick-add', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload),
      });
      const data = await res.json();
      if (data.ok) saved++;
      else failed.push(item);
    } catch { failed.push(item); }
  }

  if (!failed.length) {
    window.location.href = '/collection';
    return;
  }

  btn.disabled    = false;
  btn.textContent = 'Save to Collection';
  queueItems      = failed;
  syncQueue();
  alert(`${saved} saved. ${failed.length} failed — they remain in your queue.`);
}
</script>
{% endblock %}
